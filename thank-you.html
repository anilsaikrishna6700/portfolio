<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank You | Anil Sai Krishna</title>
  <style>
    :root { --navy: #020d2b; --sand: #f5f1e6; --brass: #e3c687; --teal: #137495; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--sand);
      background: radial-gradient(circle at 80% 15%, rgba(19,116,149,.4), transparent 45%), var(--navy);
      font-family: Georgia, serif;
      text-align: center;
    }
    main { max-width: 560px; }
    .mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border: 1px solid var(--brass);
      border-radius: 50%;
      color: var(--brass);
      font-size: 32px;
    }
    h1 { margin: 0 0 16px; font-size: clamp(34px, 7vw, 58px); }
    p { margin: 0 auto 28px; color: rgba(245,241,230,.75); font: 16px/1.7 Arial, sans-serif; }
    a {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 3px;
      color: var(--navy);
      background: var(--brass);
      font: 600 14px Arial, sans-serif;
      text-decoration: none;
    }
    a:hover { background: #f0d99e; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">&#10003;</div>
    <h1>Thank you.</h1>
    <p>Your message has been sent successfully. Anil will get back to you as soon as possible.</p>
    <a href="./">Return to portfolio</a>
  </main>
</body>
</html>
